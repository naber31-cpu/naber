plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sipahi.ipstudy'
    compileSdk 35

    defaultConfig {
        applicationId "com.sipahi.ipstudy"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}
